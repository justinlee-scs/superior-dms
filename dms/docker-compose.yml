services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    depends_on:
      - web
      - ui
    restart: unless-stopped

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    environment:
      MINIO_ROOT_USER: ${SILO_ACCESS_KEY:?Set SILO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${SILO_SECRET_KEY:?Set SILO_SECRET_KEY in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      # Keep the existing volume name so SILO takes over the current object data.
      - minio_data:/data
      - ${MINIO_CERTS_DIR:-./certs}:/etc/minio/certs
    networks:
      default:
        aliases:
          - minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  ollama:
    image: ollama/ollama:0.40.16
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-model-init:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3.1:8b-instruct-q4_K_M
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$$OLLAMA_MODEL\""]
    restart: "no"

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dms}
    command:
      [
        "postgres",
        "-c",
        "checkpoint_timeout=30min",
        "-c",
        "max_wal_size=2GB",
        "-c",
        "checkpoint_completion_target=0.9",
        "-c",
        "log_checkpoints=off",
      ]
    ports:
      - "5435:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      LICENSING_DATABASE_URL: ${LICENSING_DATABASE_URL:?Set LICENSING_DATABASE_URL in .env}
      OBJECT_STORAGE_ENABLED: "true"
      OBJECT_STORAGE_BACKEND: silo
      OBJECT_STORAGE_BUCKET: dms
      SILO_ENDPOINT: silo:9000
      SILO_ACCESS_KEY: ${SILO_ACCESS_KEY:?Set SILO_ACCESS_KEY in .env}
      SILO_SECRET_KEY: ${SILO_SECRET_KEY:?Set SILO_SECRET_KEY in .env}
      SILO_SECURE: "false"
      UVICORN_WORKERS: "4"
      OLLAMA_URL: "http://ollama:11434/api/generate"
      OLLAMA_MODEL: "llama3.1:8b-instruct-q4_K_M"
      CORS_ALLOW_ORIGINS: "https://dms.scsgroup.ca,http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "8008:8008"
    depends_on:
      db:
        condition: service_started
      silo:
        condition: service_started
      ollama:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
    volumes:
      - .:/app:delegated
    command:
      [
        "sh",
        "-c",
        "PYTHONPATH=/app python app/db/init_db.py && PYTHONPATH=/app python scripts/bootstrap_admin.py && PYTHONPATH=/app PYTHONPATH=/app python scripts/seeds_for_rbac.py && uvicorn app.main:app --host 0.0.0.0 --port 8008 --workers ${UVICORN_WORKERS:-4}",
      ]
    restart: unless-stopped

  label-studio:
    image: heartexlabs/label-studio:latest
    user: "1001:0"
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/data/media
      - SSRF_PROTECTION_ENABLED=false
      - DISABLE_SIGNUP_WITHOUT_LINK=false
      - LOCAL_FILES_SERVING_ENABLED=true
    ports:
      - "8800:8080"
    volumes:
      - labelstudio_data:/label-studio/data
      - ./output:/data/media # relative path — dms/output
    command: label-studio start
    restart: unless-stopped
    depends_on:
      - db

  image-server:
    image: python:3.12-slim
    working_dir: /images
    command: python -m http.server 8089
    ports:
      - "8089:8089"
    volumes:
      - ./output:/images # relative path — dms/output
    restart: unless-stopped

  ui:
    build:
      context: ../UI
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ../UI:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_DEV_API_PROXY_TARGET=http://web:8008
    depends_on:
      - web

volumes:
  minio_data:
    name: ${MINIO_VOLUME_NAME:-dms_minio_data}
  labelstudio_data:
  caddy_data:
  caddy_config:
  ollama_data:
